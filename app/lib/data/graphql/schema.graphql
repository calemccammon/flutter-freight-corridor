  latestTrainLocations(where: TrainLocationWhere, skip: Int, take: Int, orderBy: [TrainLocationOrderBy]): [TrainLocation!]!
  compositionsGreaterThanVersion(version: String!, where: CompositionWhere, skip: Int, take: Int, orderBy: [CompositionOrderBy]): [Composition!]!
  trainTrackingMessagesByVersionGreaterThan(version: String!, where: TrainTrackingMessageWhere, skip: Int, take: Int, orderBy: [TrainTrackingMessageOrderBy]): [TrainTrackingMessage!]!
  routesetMessagesByVersionGreaterThan(version: String!, where: RoutesetMessageWhere, skip: Int, take: Int, orderBy: [RoutesetMessageOrderBy]): [RoutesetMessage!]!
  stations(where: StationWhere, skip: Int, take: Int, orderBy: [StationOrderBy]): [Station!]!
  passengerInformationMessages(where: PassengerInformationMessageWhere, skip: Int, take: Int, orderBy: [PassengerInformationMessageOrderBy]): [PassengerInformationMessage!]!
  passengerInformationMessagesByStation(stationShortCode: String!, onlyGeneral: Boolean, where: PassengerInformationMessageWhere, skip: Int, take: Int, orderBy: [PassengerInformationMessageOrderBy]): [PassengerInformationMessage!]!
  passengerInformationMessagesByTrain(trainNumber: Int!, departureDate: Date!, where: PassengerInformationMessageWhere, skip: Int, take: Int, orderBy: [PassengerInformationMessageOrderBy]): [PassengerInformationMessage!]!
}

