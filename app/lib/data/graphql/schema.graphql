  trainsByVersionGreaterThan(version: String!, where: TrainWhere, skip: Int, take: Int, orderBy: [TrainOrderBy]): [Train!]!
  trainsByStationAndQuantity(station: String!, arrivedTrains: Int, arrivingTrains: Int, departedTrains: Int, departingTrains: Int, includeNonStopping: Boolean, trainCategories: [String], where: TrainWhere, skip: Int, take: Int, orderBy: [TrainOrderBy]): [Train!]!
  trainsByRoute(departureStation: String!, arrivalStation: String!, departureDate: Date, startDate: DateTime, endDate: DateTime, limit: Int, includeNonStopping: Boolean, where: TrainWhere, skip: Int, take: Int, orderBy: [TrainOrderBy]): [Train!]!
