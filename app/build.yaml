targets:
  $default:
    builders:
      ferry_generator|graphql_builder:
        enabled: true
        options:
          schema: freight_corridor|lib/data/graphql/schema.graphql
          # The API's custom scalars are surfaced as plain strings and parsed in
          # freight_core, so the generated layer needs no bespoke built_value
          # serializers and date handling stays in one testable place.
          type_overrides:
            Date:
              name: String
            DateTime:
              name: String
      ferry_generator|serializer_builder:
        enabled: true
        options:
          schema: freight_corridor|lib/data/graphql/schema.graphql
