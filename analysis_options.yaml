include: package:flutter_lints/flutter.yaml

analyzer:
  # Generated sources are gitignored and regenerated in CI, so they are never
  # reviewed and should never fail analysis. See README for why they are not
  # committed: ferry emits built_value types for the whole 133-type schema.
  exclude:
    - "**/*.g.dart"
    - "**/*.gql.dart"
    - "**/*.ast.gql.dart"
    - "**/*.data.gql.dart"
    - "**/*.req.gql.dart"
    - "**/*.var.gql.dart"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - prefer_final_locals
    - prefer_relative_imports
    - prefer_single_quotes
    - unawaited_futures
    - use_super_parameters
